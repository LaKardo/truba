name: watch-releases

# Раз в сутки: появилась ли новая ImmortalWrt или OpenWrt 25.12.x, под которую в фиде ещё нет сборки?
# Если да — запускает build. Обновлять Роутер стоит только после этого (ADR 0004).

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      missing: ${{ steps.c.outputs.missing }}
    steps:
      - id: c
        run: |
          set -euo pipefail
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          published=$(curl -fsSL "$site/versions.txt" 2>/dev/null || true)
          missing=""
          # Каталог фида и строка versions.txt: ImmortalWrt — «<версия>», OpenWrt — «openwrt/<версия>».
          for dist in immortalwrt openwrt; do
            case "$dist" in
              immortalwrt) dl=https://downloads.immortalwrt.org; pre= ;;
              openwrt)     dl=https://downloads.openwrt.org;     pre=openwrt/ ;;
            esac
            # Только выпуски новее последнего опубликованного фида: каталог прежней версии
            # из фида убирают намеренно, заново его не собираем (вернуть — router/VERSIONS).
            newest=$(grep -E "^${pre}25\.12\.[0-9]+\$" <<<"$published" | sed "s#^$pre##" | sort -V | tail -1 || true)
            # Дистрибутив без опубликованного фида не отслеживается: его первую версию задаёт
            # router/VERSIONS, иначе собрались бы сразу все его выпуски 25.12.x.
            [ -n "$newest" ] || { echo "$dist: фида ещё нет — пропущен"; continue; }
            releases=$(curl -fsSL "$dl/releases/" \
              | grep -oE 'href="25\.12\.[0-9]+/"' | grep -oE '25\.12\.[0-9]+' | sort -uV)
            for v in $releases; do
              if printf '%s\n' "$v" "$newest" | sort -VC; then
                continue
              fi
              if ! curl -fsI "$site/$pre$v/mediatek/filogic/packages.adb" >/dev/null 2>&1; then
                missing="${missing:+$missing,}$dist/$v"
              fi
            done
          done
          echo "Нет сборки для: ${missing:-—}"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  # Закреплённые библиотеки интерфейса (lib/VERSIONS, ADR 0017): вышла новая версия — предупреждение
  # в сводке прогона. Обновляет человек: версия в VERSIONS, node tests/luci/vendor.mjs, проверки.
  libs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          grep -v -e '^#' -e '^[[:space:]]*$' router/luci-app-truba/htdocs/luci-static/resources/truba/lib/VERSIONS \
            | while read -r file pkg path sum; do
                name=${pkg%@*} have=${pkg##*@}
                latest=$(npm view "$name" version)
                if [ "$latest" != "$have" ]; then
                  echo "::warning title=Библиотека интерфейса::$name $have → $latest ($file)"
                  echo "- $name: $have → $latest ($file)" >> "$GITHUB_STEP_SUMMARY"
                fi
              done

  build:
    needs: check
    if: needs.check.outputs.missing != ''
    # Права вызванного build.yml не выше этих: deploy публикует фид в gh-pages.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      versions: ${{ needs.check.outputs.missing }}
    secrets: inherit
