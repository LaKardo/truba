name: tests

# Проверки tests/run.sh: каждая часть — своим заданием, все параллельно (ADR 0012).
# Запускается на pull request и из build.yml перед публикацией фида — матрица одна, здесь.
# Действия закреплены по коммиту (SHA), а не по тегу: тег можно передвинуть.

on:
  pull_request:
    # vps/** — тоже: часть vps проверяет install-vps.sh.
    paths: [ 'router/**', 'vps/**', 'tests/**', '.github/workflows/tests.yml' ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  # Новый коммит в PR отменяет прежний прогон; прогон для публикации фида не отменяется.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # Часть идёт до ~2 мин; предел — чтобы зависший шаг не держал задание до 6 ч.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [ units, dat, vps, luci, ui, router-net, router-dns, router-lists, router-life, router-tunnel, router-stats ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Образы Docker — из кэша на неделю: задание не ходит в Docker Hub (лимит раннеров GitHub
      # там общий и кончается) и не ставит заново зависимости в образ Роутера. Раз в неделю
      # кэш обновляется — и с ним последняя ImmortalWrt 25.12.x. Ключ тот же, что в upstream-lists.yml.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Образы Docker из кэша
        # luci идёт на Node раннера, без образов.
        if: matrix.part != 'luci'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-images
          # Образ зависит от списка пакетов и версий, а не от сценариев тестов.
          # Для router-* один и тот же TEST_IMG не сохраняется отдельной копией на часть.
          key: images-${{ startsWith(matrix.part, 'router-') && 'router' || matrix.part }}-${{ hashFiles('tests/images.env') }}-${{ steps.week.outputs.week }}
      - name: Проверки (${{ matrix.part }})
        env:
          UI_OUT: ${{ github.workspace }}/ui-screens
          IMAGE_CACHE: ${{ runner.temp }}/docker-images
        run: bash tests/run.sh ${{ matrix.part }}
      # Снимки всех вкладок — посмотреть интерфейс из PR, не поднимая стенд.
      - name: Снимки вкладок LuCI
        if: always() && matrix.part == 'ui'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screens
          path: ui-screens/
          if-no-files-found: ignore
