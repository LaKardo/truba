name: tests

# Проверки tests/run.sh: каждая часть — своим заданием, все параллельно (ADR 0012).
# Запускается на pull request и из build.yml перед публикацией фида — матрица одна, здесь.
# Действия закреплены по коммиту (SHA), а не по тегу: тег можно передвинуть.

on:
  pull_request:
    # vps/** — тоже: часть vps проверяет install-vps.sh.
    paths: [ 'router/**', 'vps/**', 'tests/**', '.github/workflows/tests.yml' ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  # Новый коммит в PR отменяет прежний прогон; прогон для публикации фида не отменяется.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # Часть идёт до ~2 мин; предел — чтобы зависший шаг не держал задание до 6 ч.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [ units, dat, vps, luci, ui, router-net, router-dns, router-lists, router-life, router-tunnel, router-stats ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Проверки (${{ matrix.part }})
        env:
          UI_OUT: ${{ github.workspace }}/ui-screens
        run: bash tests/run.sh ${{ matrix.part }}
      # Снимки всех вкладок — посмотреть интерфейс из PR, не поднимая стенд.
      - name: Снимки вкладок LuCI
        if: always() && matrix.part == 'ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screens
          path: ui-screens/
          if-no-files-found: ignore
