name: upstream-lists

# Раз в сутки: разбирает ли распаковщик свежие geoip.dat и geosite.dat из release-веток
# kirilllavrov и работает ли с ними служба. Проверки на PR идут на зафиксированных выпусках
# (tests/dat.pin), поэтому смену формата у источника заметит только эта задача — раньше,
# чем Роутер скачает такой файл (update-lists его и так не примет, но списки встанут).

on:
  schedule:
    - cron: '0 13 * * *'   # после выхода списков (geoip — около 10–11 UTC) и проверки Роутера в 12:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [ dat, router-net, router-dns, router-lists, router-life, router-tunnel, router-stats ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Те же образы и тот же ключ кэша, что в tests.yml: эта задача идёт на main и прогревает
      # кэш, который берут проверки на PR.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Образы Docker из кэша
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/docker-images
          key: images-${{ matrix.part }}-${{ hashFiles('tests/run.sh') }}-${{ steps.week.outputs.week }}
      - name: Свежие списки (${{ matrix.part }})
        env:
          DAT_FRESH: '1'
          IMAGE_CACHE: ${{ runner.temp }}/docker-images
        run: bash tests/run.sh ${{ matrix.part }}
