name: build

# Сборка пакетов Трубы и AmneziaWG под ImmortalWrt (mediatek/filogic) и публикация
# подписанного apk-фида в GitHub Pages: /<версия>/mediatek/filogic/packages.adb (ADR 0004).
#
# Секреты репозитория:
#   APK_SIGN_KEY  — закрытый ключ EC P-256 (PEM):  openssl ecparam -name prime256v1 -genkey -noout -out truba-feed.pem
#   APK_SIGN_PUB  — открытый ключ (PEM):           openssl ec -in truba-feed.pem -pubout > truba-feed.pub.pem

on:
  push:
    branches: [ main ]
    paths: [ 'router/**', 'tests/**', '.github/workflows/build.yml' ]
  workflow_dispatch:
    inputs:
      versions:
        description: 'Версии ImmortalWrt через запятую (пусто — из router/VERSIONS)'
        required: false
        type: string
  workflow_call:
    inputs:
      versions:
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

env:
  TARGET: mediatek
  SUBTARGET: filogic

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Проверки (распаковщик, роутер под procd, VPS, LuCI)
        run: bash tests/run.sh all

  matrix:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          list="${{ inputs.versions }}"
          [ -n "$list" ] || list=$(grep -E '^[0-9]' router/VERSIONS | paste -sd, -)
          echo "versions=$(echo "$list" | tr -d ' ' | jq -R -c 'split(",") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: [ test, matrix ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: ImmortalWrt SDK ${{ matrix.version }}
        run: |
          set -euo pipefail
          base="https://downloads.immortalwrt.org/releases/${{ matrix.version }}/targets/$TARGET/$SUBTARGET"
          wget -q "$base/sha256sums"
          sdk=$(grep -oE 'immortalwrt-sdk-[^ ]+\.tar\.zst' sha256sums | head -1)
          [ -n "$sdk" ] || { echo "SDK не найден в $base"; exit 1; }
          wget -q "$base/$sdk"
          grep " \*$sdk\$" sha256sums | sed 's/ \*/  /' | sha256sum -c -
          mkdir sdk && tar -I zstd -xf "$sdk" -C sdk --strip-components=1

      - name: Фиды и исходники AmneziaWG
        run: |
          set -euo pipefail
          . router/awg/SOURCES
          git clone -q "$AWG_OPENWRT_REPO" awg-src
          git -C awg-src checkout -q "$AWG_OPENWRT_COMMIT"

          feed="$PWD/feed-src"
          mkdir -p "$feed"
          cp -a awg-src/kmod-amneziawg awg-src/amneziawg-tools awg-src/luci-proto-amneziawg "$feed/"
          # amneziawg-tools не должен жёстко требовать модуль ядра: запасной вариант — amneziawg-go.
          sed -i '/+kmod-amneziawg/d' "$feed/amneziawg-tools/Makefile"
          sed -i 's/^\(\s*+!BUSYBOX_CONFIG_FEATURE_IP_LINK:ip\) \\$/\1/' "$feed/amneziawg-tools/Makefile"
          # Версия перевода = версия пакета (иначе 0, см. router/luci-app-truba/Makefile).
          sed -i 's|^include $(TOPDIR)/feeds/luci/luci.mk|PKG_PO_VERSION=$(PKG_VERSION)-r$(PKG_RELEASE)\n&|' \
            "$feed/luci-proto-amneziawg/Makefile"
          grep -q '^PKG_PO_VERSION=' "$feed/luci-proto-amneziawg/Makefile"
          cp -a router/awg/amneziawg-go router/truba router/luci-app-truba "$feed/"

          cd sdk
          cp feeds.conf.default feeds.conf
          echo "src-link truba $feed" >> feeds.conf
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a -p truba
          ./scripts/feeds install mosdns curl ip-full kmod-nft-fullcone ucode luci-base golang >/dev/null

      - name: Ключ подписи фида
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
          APK_SIGN_PUB: ${{ secrets.APK_SIGN_PUB }}
        run: |
          set -euo pipefail
          if [ -z "${APK_SIGN_KEY:-}" ] || [ -z "${APK_SIGN_PUB:-}" ]; then
            echo "Нет секретов APK_SIGN_KEY/APK_SIGN_PUB — см. заголовок workflow"; exit 1
          fi
          printf '%s\n' "$APK_SIGN_KEY" > sdk/private-key.pem
          printf '%s\n' "$APK_SIGN_PUB" > sdk/public-key.pem
          chmod 600 sdk/private-key.pem

      - name: Сборка
        run: |
          set -euo pipefail
          cd sdk
          cat > .config <<'EOF'
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_amneziawg-go=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          CONFIG_PACKAGE_truba=m
          CONFIG_PACKAGE_luci-app-truba=m
          CONFIG_PACKAGE_luci-i18n-truba-ru=m
          CONFIG_SIGNED_PACKAGES=y
          EOF
          # Предупреждения kconfig SDK (прошивки других плат, bool→tristate, рекурсия у curl) безвредны.
          make defconfig >/dev/null 2>&1
          mkdir -p logs
          for p in kmod-amneziawg amneziawg-tools amneziawg-go luci-proto-amneziawg truba luci-app-truba; do
            t0=$(date +%s)
            echo "::group::$p"
            if ! make -j"$(nproc)" "package/feeds/truba/$p/compile" V=s >"logs/build-$p.log" 2>&1; then
              tail -100 "logs/build-$p.log"
              echo "::endgroup::"
              echo "::error::$p не собрался — полный лог в артефакте build-logs"
              exit 1
            fi
            echo "::endgroup::"
            echo "$p собран за $(( ($(date +%s) - t0) / 60 )) мин"
          done

          # SDK кладёт пакеты по разным каталогам (kmod — к цели, остальные — в подкаталог фида):
          # собираем все наши .apk в один плоский каталог фида.
          out="$PWD/bin/truba-feed"
          rm -rf "$out" && mkdir -p "$out"
          find bin -name '*.apk' -newer .config \( -name 'kmod-amneziawg-*' -o -name 'amneziawg-*' \
            -o -name 'luci-proto-amneziawg-*' -o -name 'luci-i18n-amneziawg-*' -o -name 'truba-*' \
            -o -name 'luci-app-truba-*' -o -name 'luci-i18n-truba-*' \) -not -path "$out/*" -print -exec cp -f {} "$out/" \;

          missing=0
          for want in kmod-amneziawg amneziawg-tools amneziawg-go luci-proto-amneziawg truba luci-app-truba luci-i18n-truba-ru; do
            if ! ls "$out/$want"-[0-9]*.apk >/dev/null 2>&1; then
              echo "::error::в фиде нет пакета $want"
              missing=1
            fi
          done
          if ls "$out"/*-0.apk >/dev/null 2>&1; then
            ls "$out"/*-0.apk | sed 's/^/::error::версия 0 у /'
            missing=1
          fi
          [ "$missing" = 0 ] || { find bin -name '*.apk' -newer .config; exit 1; }

          make package/index V=s PACKAGE_DIR="$out" >logs/index.log 2>&1 || { tail -50 logs/index.log; exit 1; }
          test -s "$out/packages.adb"
          ls -la "$out"

      - name: Каталог фида
        run: |
          set -euo pipefail
          dst="publish/${{ matrix.version }}/$TARGET/$SUBTARGET"
          mkdir -p "$dst" publish/keys
          cp -a sdk/bin/truba-feed/. "$dst/"
          cp sdk/public-key.pem publish/keys/truba.pem
          printf '{"version":"%s","target":"%s","subtarget":"%s","built":"%s"}\n' \
            "${{ matrix.version }}" "$TARGET" "$SUBTARGET" "$(date -u +%FT%TZ)" > "$dst/feed.json"

      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.version }}
          path: publish/
          if-no-files-found: error

      - name: Логи сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.version }}
          path: sdk/logs/
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Текущее содержимое Pages
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch -q --depth=1 origin gh-pages
            git --work-tree=site checkout FETCH_HEAD -- .
          fi
      - uses: actions/download-artifact@v4
        with:
          path: site
          pattern: feed-*
          merge-multiple: true
      - name: Индекс версий
        run: |
          cd site
          ls -d */mediatek/filogic 2>/dev/null | cut -d/ -f1 | sort -V > versions.txt
          cat versions.txt
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          enable_jekyll: false
